name: Pi Code Review

on:
  pull_request:
    types: [opened, synchronize]

concurrency:
  group: pi-review-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

jobs:
  review:
    name: Pi Review
    runs-on: ubuntu-latest
    steps:
      # Pinned to an exact tag, not `@v5` — see `ci.yml`, where the runner
      # failure that motivated it is written out. `pi-review@v11` below is our
      # own tag and carries the same hazard: moving it in place leaves this
      # runner's action cache holding a key that no longer means one tree.
      - uses: actions/checkout@v5.1.0
        with:
          fetch-depth: 0
          token: ${{ secrets.CL_REPO_TOKEN }}

      - name: Run Pi code review
        uses: https://git.markushofstetter.com/dividbzero/pi-review@v11
        with:
          api_key: ${{ secrets.ZAI_API_KEY }}
          provider: zai
          model: glm-5.3
          token: ${{ secrets.CL_REPO_TOKEN }}
          debug: "true"
          # Self-hosted-runner only: the runner shares a Docker network with the
          # Gitea host, reachable internally as `server:3000`
