# FieldFiller CI.
#
# Two jobs on purpose. `quality` answers "is the source sound?" and `package`
# answers "is the artefact shippable?" — the second is where every claim the
# project makes publicly gets enforced, so a failure there should be legible
# without reading past a compile error.
#
# The gates in `package` are not hygiene. Each one keeps a stated claim true:
#   · size        → G6 and NFR-003, quoted publicly as 40 KB vs the reference's 480 KB
#   · imports     → ND-4, the import edge that shipped Firebase into every page
#   · network     → G3 and NFR-033, "no outbound request, ever"
#   · reproducible → G4 and NFR-011, the digest an auditor checks
#
# They run from the first commit rather than before the first release because
# every one of them is cheap to satisfy now and expensive to retrofit: a
# reproducible build bolted on at the end means the digests simply differ, with
# nothing to show for it.
#
# Every third-party action is pinned to an exact release tag rather than a
# floating major. `actions/setup-node@v4` took this runner down on 2026-08-18:
# act caches actions under `~/.cache/act/<sha256(owner/repo@ref)>`, so the key
# `actions/setup-node@v4` is a promise the tag itself does not keep — upstream
# force-moves it on every 4.x release, and the entry ended up holding one ref's
# file list over another ref's checkout. The step died at 0s with
# `lstat …/eslint.config.mjs: no such file or directory`, naming a file that
# exists on that action's `main` and on no v4 tag at all. Nothing in this
# repository had changed.
#
# An exact tag makes a cache key mean one tree forever, which is the property
# act already assumes it has. It is also the argument NFR-011 makes about the
# package manager below, applied to the one class of build input this file was
# still leaving unpinned: an action is a dependency, and `@v4` is a range.
#
# Tags rather than commit SHAs because this is Gitea. act_runner fetches a
# *named ref*, and an arbitrary SHA is not one — a SHA pin is the shape that
# fails here, which is the trap this comment exists to keep the next reader out
# of. Each pin below is the commit its floating tag pointed at when this was
# written, so no behaviour changed; only the tag's freedom to move did.
name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5.1.0

      # No `cache: pnpm` here, though it is the obvious way to write this. That
      # option makes `setup-node` shell out to `pnpm store path` to find the
      # directory it should cache, and pnpm does not exist yet — this step is
      # what provides the `node` the next step installs it with. The order is
      # not rearrangeable: `cache: pnpm` wants pnpm first, installing pnpm wants
      # node first.
      #
      # So the store is cached explicitly two steps down instead. Same benefit,
      # no ordering constraint, and it survived the runner losing pnpm from
      # `PATH` — which is how this arrangement was arrived at.
      #
      # `pnpm store path` reports the configured directory whether or not it
      # exists yet, so a cold runner needs no special case.
      - name: Set up Node.js
        uses: actions/setup-node@v4.4.0
        with:
          node-version: 24

      - name: Install pnpm
        # Installed from the pin in `package.json` rather than through
        # `pnpm/action-setup`. The package manager is an input to the
        # reproducible build (NFR-011), so the version lives in the tree and a
        # local run uses the same one CI does — reading it here keeps that single
        # source rather than restating it as a workflow input.
        #
        # The action was dropped after failing this runner twice, in two
        # different ways: once installing successfully but leaving pnpm off
        # `PATH` for the step after it, and once unable to load at all
        # ("Cannot find module …/dist/index.js" — the runner's own action cache,
        # not anything in this file). Neither failure was about pnpm. A
        # third-party JavaScript action in front of every job is a dependency
        # this needs about as much as the extension needs a framework, and `npm`
        # is already here.
        run: |
          set -euo pipefail
          version="$(node -p "require('./package.json').packageManager.split('@')[1]")"
          npm install --global "pnpm@${version}"
          pnpm --version

      - name: Locate the pnpm store
        run: echo "PNPM_STORE=$(pnpm store path --silent)" >> "$GITHUB_ENV"

      - name: Cache the pnpm store
        uses: actions/cache@v4.3.0
        with:
          path: ${{ env.PNPM_STORE }}
          key: pnpm-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            pnpm-${{ runner.os }}-

      # Frozen: the lockfile is an input to the reproducible build (NFR-011), so
      # an install that is allowed to resolve differently from the committed tree
      # would make the published digest unverifiable.
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm run compile

      - name: Lint
        run: pnpm run lint

      # NFR-012's 90% line and function coverage, enforced by globbed thresholds
      # in `vitest.config.ts` across seven areas: the page engine, the
      # generators, the persona, the rule model, the result surface, the
      # settings schema and the message contract.
      #
      # That the floor "grows with the engine" was a convention until 2026-08-15
      # and is now a mechanism. Coverage *measures* `src/lib/**`, but only what a
      # glob names is *held to* anything, so a new area appeared in the report
      # gated by nothing. `scripts/check-coverage-scope.mjs`, in the `package`
      # job's gate step below, fails the build on any measured file no glob
      # matches — and found two on the day it was written.
      #
      # Run instead of a bare `pnpm test` rather than beside it, so the suite is
      # not executed twice.
      - name: Unit tests and coverage floor
        run: pnpm run test:coverage

  # NFR-014: the Chromium end-to-end suite runs on every change, and Firefox on
  # every release candidate. This job is the requirement — before it existed, the
  # browsers only ran on a developer's machine by hand, which meant the checks
  # covering the most integration risk were the ones CI could not enforce.
  #
  # `playwright` is a devDependency here purely as a browser fetcher: the
  # harnesses drive Chrome over CDP and Firefox over WebDriver BiDi themselves,
  # because Playwright cannot test Firefox extensions at all and a Chromium-only
  # harness would leave half of NFR-017's promise unverified.
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5.1.0

      # No `cache: pnpm`, and the store cached by hand instead — see the `quality`
      # job, where the reason is written out in full.
      - name: Set up Node.js
        uses: actions/setup-node@v4.4.0
        with:
          node-version: 24

      - name: Install pnpm
        # From the pin in `package.json` — see the `quality` job for why this is
        # not `pnpm/action-setup`.
        run: |
          set -euo pipefail
          version="$(node -p "require('./package.json').packageManager.split('@')[1]")"
          npm install --global "pnpm@${version}"
          pnpm --version

      - name: Locate the pnpm store
        run: echo "PNPM_STORE=$(pnpm store path --silent)" >> "$GITHUB_ENV"

      - name: Cache the pnpm store
        uses: actions/cache@v4.3.0
        with:
          path: ${{ env.PNPM_STORE }}
          key: pnpm-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            pnpm-${{ runner.os }}-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Cache browsers
        uses: actions/cache@v4.3.0
        with:
          path: ~/.cache/ms-playwright
          key: browsers-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            browsers-${{ runner.os }}-

      - name: Install Chromium
        # `--with-deps` also installs the apt packages headless Chrome needs,
        # which are not cacheable and are the usual reason a browser job fails on
        # a fresh runner.
        run: pnpm exec playwright install --with-deps chromium

      - name: Pin the Chromium path
        # `CHROME_PATH` derived once, not once per harness below: the path is an
        # output of the install step above and an input to every step that
        # follows. Written through `$GITHUB_ENV` so each harness reads it like
        # any other environment variable instead of re-deriving it.
        #
        # Bound to a variable rather than substituted straight into `echo`, so a
        # `node` that fails takes the step down with it. Substituted inline, its
        # exit status is discarded, `CHROME_PATH=` is exported empty, and the
        # step stays green — and every harness quietly falls back to deriving
        # the path itself, which is the work this step exists to remove. Note
        # the quoting: this is a YAML block scalar, which passes backslashes
        # through untouched, so the inner quotes must be bare.
        #
        # Every step below therefore reads `CHROME_PATH` and derives nothing.
        # Two steps have broken that, both with an inline
        # `export CHROME_PATH="$(node …)"` — the locale step, from the day it was
        # added until 2026-08-17, and the options step, which was written on a
        # branch before that fix and brought it back through a rebase. It is the
        # discarded-exit-status shape described above wearing `export` in place
        # of `echo`: a `node` that fails exports an empty path and the harness
        # silently falls back to finding a browser itself.
        #
        # Twice is the pattern worth naming. A step that needs the binary adds no
        # derivation of its own; if this pin ever has to change, it changes here.
        run: |
          chromium="$(node -e 'console.log(require("playwright").chromium.executablePath())')"
          echo "CHROME_PATH=$chromium" >> "$GITHUB_ENV"

      - name: Build the Chromium package
        run: pnpm run build

      - name: Extension loads (Chromium)
        run: pnpm run smoke:chrome

      - name: End-to-end fill (Chromium)
        # The whole pipeline against the reference page: every control kind, the
        # exclusions, confirmation fields, both frame kinds and an open shadow
        # root — all from one persona.
        run: pnpm run e2e:chrome

      - name: Scopes and exclusion (Chromium)
        # UC-002, UC-003 and UC-008. What this covers that the unit tests cannot:
        # the context menu's frameId, the badge, and the fact that the agent has
        # to have seen the right-click itself because Chrome names no element
        # (DD-001). It has already earned its place twice — it caught a form
        # scope that widened to the whole page through `<body>`, and a badge
        # revert timer that erased the exclusion mark set after it.
        run: pnpm run scopes:chrome

      - name: Options page (Chromium)
        # UC-009..UC-013 driven the way a person drives them — clicking Add,
        # typing into fields — so what is under test is the wiring rather than
        # the logic. It has already earned its place: it caught a rule editor
        # whose handlers closed over stale state, so editing two fields in a row
        # discarded the first, and a change of generator type that never
        # re-rendered its own fields.
        run: pnpm run options:chrome

      - name: Settings screens (Chromium)
        # UC-018..UC-023, and the half that matters is the second half of every
        # check: three of these settings sat in the schema being read by nothing
        # at all, so "the checkbox stored false" proves nothing worth knowing.
        # Each section is driven through the UI and then observed on a filled
        # page. Writing it caught a harness that could pass by the fill never
        # running, which is the failure mode a green build is least able to see.
        run: pnpm run settings:chrome

      - name: Profiles (Chromium)
        # UC-014..UC-017. The rule editor runs over a profile's rules through a
        # lens, so the failure worth catching is it writing to the wrong list —
        # which storage shows and a rendered page does not. It found two things
        # on its first run: a profile's "matches nothing" flag that never cleared
        # when the pattern fixing it was typed, and an Add button indistinguishable
        # from the rule editor's own.
        run: pnpm run profiles:chrome

      - name: Export to a file (Chromium)
        # UC-025, and it is here rather than folded into the options step for the
        # reason BR-025-2 exists: the file leaves through an anchor and an object
        # URL because `downloads` is a permission this project refuses, and that
        # path fails silently in ways an API call would not — a URL revoked
        # before the download reads it, a click the browser declines to act on.
        # So the assertion is a file appearing on disk, twice, with the same
        # bytes, and the manifest checked in the same run to still lack the
        # permission. Writing it found neither of those: what it found was that
        # storage hands settings back with its keys alphabetised, which is the
        # thing BR-025-3's serialiser exists to undo.
        run: pnpm run export:chrome

      - name: Import from a file (Chromium)
        # UC-026, and its centrepiece is a round trip: a configuration exported
        # through UC-025 and imported straight back, asserted to leave storage
        # holding what it held before. The two use cases are one format seen from
        # both ends, and this is the only place that claim is checked as a whole
        # rather than as two halves agreeing with the same unit test.
        #
        # The refusals are the other half, and A5 is why they are here at all:
        # the tolerant parser cannot fail, so a file from another tool would
        # otherwise import as a complete set of defaults and report success —
        # a green screen over a configuration that is gone.
        run: pnpm run import:chrome

      - name: Migrate from a Fake Filler backup (Chromium)
        # UC-027. The translation is decided by unit tests; what only a browser
        # can see is everything around it — the Base64 transport through the
        # page's own file input, the two-list report on screen, the write only
        # on the second click, and the importer and the migrator pointing at
        # each other's files rather than both claiming them or neither. It was
        # this tier that caught the catalog placeholders bug that made the
        # extension uninstallable with every unit test green, which is the
        # reason a harness ships wired rather than by hand.
        run: pnpm run migrate:chrome

      - name: Restore the shipped defaults (Chromium)
        # UC-028. The counts are the confirmation (BR-028-2), so the checks
        # that matter most are order and liveness: nothing written before the
        # second click, the counts following same-page edits and foreign
        # writes while the confirmation stands open, and the way back named
        # before the write rather than after it. Pre-existing here only by
        # omission — wired with the migrate harness that shared the gap.
        run: pnpm run restore:chrome

      - name: Corpus per locale (Chromium)
        # The path a unit test cannot reach: a locale written to storage, parsed
        # back, resolved, and turned into a record on a real page. Until this
        # existed de-CH had never run in a browser at all — every other run uses
        # the default, which resolves to en-US on a headless Chrome.
        run: pnpm run locale:chrome

      - name: Dependent fields (Chromium)
        # UC-034's scoreboard, and since 2026-08-15 a regression gate: all three
        # DD-009 steps have landed and every row is expected to pass. A red build
        # here means a cascade the engine used to follow and no longer does.
        #
        # It stays expectation-based rather than becoming a plain assertion, so
        # it still fails on a case that starts passing without its expectation
        # being updated in the same change. That direction matters as much as the
        # other: the table is the record of what this engine can do, and a row
        # that quietly starts passing is a claim nobody wrote down.
        run: pnpm run cascade:chrome

      # Installed on every run, not only on tags. NFR-014 asks for the *packaged
      # add-on* to be exercised in Firefox on release candidates and for the
      # *engine* to run against both targets on every change, and the second of
      # those needs a browser here every time. Installed from Mozilla directly
      # rather than through Playwright, whose Firefox is a patched build that
      # does not expose the remote agent the BiDi harness attaches to.
      - name: Pin the Firefox cache to a week
        # The download is `firefox-latest-ssl`, which by design answers
        # differently over time, so it cannot be keyed on a lockfile the way the
        # Chromium cache above is. Keyed on the ISO week instead: the runner
        # fetches Firefox once a week rather than once a run, and is never more
        # than a week behind the release NFR-014 asks us to track. A day key
        # would cache almost nothing — this job does not run daily — and a fixed
        # key would pin the browser to whenever the cache was first written,
        # which is the opposite of what "latest" is here for.
        id: firefox-week
        run: echo "week=$(date -u +%G-W%V)" >> "$GITHUB_OUTPUT"

      - name: Cache Firefox
        id: firefox-cache
        uses: actions/cache@v4.3.0
        with:
          path: /tmp/firefox
          # No `restore-keys`. A partial match would restore last week's browser
          # and then skip the download that was supposed to replace it, so the
          # pin above would silently stop meaning anything.
          key: firefox-${{ runner.os }}-${{ steps.firefox-week.outputs.week }}

      # Firefox's own apt dependencies, which the Chromium install above does not
      # cover: Playwright's dependency table lists several packages for Firefox
      # that are absent from Chromium's, `libdbus-glib-1-2` among them. Without
      # it the Mozilla build dies at exec — "error while loading shared
      # libraries" — before it can open a port, and the harness waiting for that
      # port reports a timeout, which names the wrong thing.
      #
      # `install-deps` rather than `install --with-deps firefox`: only the apt
      # packages are wanted here. Playwright's own Firefox is a patched build
      # with no remote agent for the BiDi harness to attach to, so the browser
      # still comes from Mozilla directly, below.
      #
      # Outside the cache guard on purpose — the cache holds /tmp/firefox, not
      # anything apt installed, so a cache hit still needs these.
      - name: Install Firefox's system dependencies
        run: pnpm exec playwright install-deps firefox

      - name: Install Firefox
        if: steps.firefox-cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          # `--fail` because without it curl exits 0 on a 404 and writes the
          # error page into the tarball: the job still fails, but as "not a
          # valid archive" from tar, naming the wrong step.
          curl -fsSL -o /tmp/firefox.tar.xz \
            'https://download.mozilla.org/?product=firefox-latest-ssl&os=linux64&lang=en-US'
          tar -xJf /tmp/firefox.tar.xz -C /tmp

      # Cheap, and it fails in the step that owns the browser rather than inside
      # a harness: `--version` needs every shared library a real run does, so a
      # missing dependency is named here instead of surfacing as a fill that
      # never started.
      - name: Check Firefox runs
        run: /tmp/firefox/firefox --version

      - name: Extension loads (Firefox)
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          pnpm run build:firefox
          FIREFOX_PATH=/tmp/firefox/firefox pnpm run smoke:firefox

      # The other half of NFR-014, and it runs on *every* change rather than on
      # tags: it needs no extension package, only a browser. Until it existed the
      # engine had never executed in Gecko at all — the unit suite runs once,
      # under happy-dom, which is neither of the engines we ship to, and
      # `smoke:firefox` proved the add-on installs and filled nothing.
      #
      # It cannot be moved into the Chromium job's position of "the whole product
      # end to end": the extension's own trigger cannot be synthesised in
      # Firefox, because WebDriver input goes to the content area and
      # browser-level shortcut handling is deliberately out of its reach. So this
      # covers the engine and `smoke:firefox` covers the packaging, and the join
      # between them is stated against NFR-014 rather than implied.
      - name: Engine against the reference page (Firefox)
        run: FIREFOX_PATH=/tmp/firefox/firefox pnpm run engine:firefox

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5.1.0

      # No `cache: pnpm`, and the store cached by hand instead — see the `quality`
      # job, where the reason is written out in full.
      - name: Set up Node.js
        uses: actions/setup-node@v4.4.0
        with:
          node-version: 24

      - name: Install pnpm
        # From the pin in `package.json` — see the `quality` job for why this is
        # not `pnpm/action-setup`.
        run: |
          set -euo pipefail
          version="$(node -p "require('./package.json').packageManager.split('@')[1]")"
          npm install --global "pnpm@${version}"
          pnpm --version

      - name: Locate the pnpm store
        run: echo "PNPM_STORE=$(pnpm store path --silent)" >> "$GITHUB_ENV"

      - name: Cache the pnpm store
        uses: actions/cache@v4.3.0
        with:
          path: ${{ env.PNPM_STORE }}
          key: pnpm-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            pnpm-${{ runner.os }}-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Both targets from one source tree (NFR-017). Building only Chromium would
      # hide exactly the divergences C-003 and C-004 exist to cover.
      - name: Build Chrome and Firefox
        run: pnpm run build:all

      # NFR-003, ND-4, NFR-006, NFR-008, NFR-012 and the i18n catalog's
      # load-bearing shape. The coverage-scope gate is the newest of the
      # floors, and the messages gate the newest of them all: every gate here
      # fails on a thing being *added* — a dependency, a permission, a
      # kilobyte — because the additions are what arrive without anyone
      # deciding. Coverage was the one floor that grew only when someone
      # remembered to widen it by hand; the catalog was the one whose
      # breakage (a $VARIABLE$ with no placeholder, added 2026-08-26) makes
      # Chrome refuse to install the extension at all, with every unit test
      # still green because nothing loads the catalog through Chrome.
      - name: Gate — page agent size, import graph, network absence, permissions, coverage scope, i18n catalog
        run: pnpm run gate:all

      # Two clean builds, digests compared. Runs on every push rather than only
      # on tags: what breaks reproducibility is a dependency bump, and the useful
      # time to learn that is on the commit that bumped it.
      - name: Gate — reproducible build
        run: pnpm run verify:reproducible

      - name: Publish artefact digests
        run: pnpm run digest

      # Staged into a plain directory rather than uploaded straight from
      # `.output`. Two things about that path are hostile to the artifact
      # action's globbing: `.output` is a dot-directory, and a multi-line `path:`
      # arrives as one newline-joined string on this runner. Copying first
      # removes both questions, and `cp` fails loudly here — naming which file is
      # missing — instead of the upload reporting an empty match much later.
      - name: Stage release artefacts
        run: |
          set -euo pipefail
          mkdir -p artefacts
          cp .output/*.zip .output/SHA256SUMS artefacts/
          ls -l artefacts

      - name: Upload packages
        uses: actions/upload-artifact@v3.2.1
        with:
          name: fieldfiller-packages
          path: artefacts
          if-no-files-found: error
