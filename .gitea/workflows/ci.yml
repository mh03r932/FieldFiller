# FieldFiller CI.
#
# Two jobs on purpose. `quality` answers "is the source sound?" and `package`
# answers "is the artefact shippable?" — the second is where every claim the
# project makes publicly gets enforced, so a failure there should be legible
# without reading past a compile error.
#
# The gates in `package` are not hygiene. Each one keeps a stated claim true:
#   · size        → G6 and NFR-003, quoted publicly as 40 KB vs the reference's 480 KB
#   · imports     → ND-4, the import edge that shipped Firebase into every page
#   · network     → G3 and NFR-033, "no outbound request, ever"
#   · reproducible → G4 and NFR-011, the digest an auditor checks
#
# They run from the first commit rather than before the first release because
# every one of them is cheap to satisfy now and expensive to retrofit: a
# reproducible build bolted on at the end means the digests simply differ, with
# nothing to show for it.
name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # No `version` input on purpose. The action refuses to run when a version
      # is given here *and* `packageManager` is set in package.json, and
      # package.json is the one that belongs: it pins 11.2.0 exactly, where
      # `version: 11` floats across minor releases. The package manager is an
      # input to the reproducible build (NFR-011), so it is pinned in the tree
      # rather than in the workflow, and local runs use the same version CI does.
      - uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      # Frozen: the lockfile is an input to the reproducible build (NFR-011), so
      # an install that is allowed to resolve differently from the committed tree
      # would make the published digest unverifiable.
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm run compile

      - name: Lint
        run: pnpm run lint

      # NFR-012's 90% line coverage, enforced on the fill engine and generators
      # by globbed thresholds in `vitest.config.ts`. Run instead of a bare `pnpm
      # test` rather than beside it, so the suite is not executed twice.
      - name: Unit tests and coverage floor
        run: pnpm run test:coverage

  # NFR-014: the Chromium end-to-end suite runs on every change, and Firefox on
  # every release candidate. This job is the requirement — before it existed, the
  # browsers only ran on a developer's machine by hand, which meant the checks
  # covering the most integration risk were the ones CI could not enforce.
  #
  # `playwright` is a devDependency here purely as a browser fetcher: the
  # harnesses drive Chrome over CDP and Firefox over WebDriver BiDi themselves,
  # because Playwright cannot test Firefox extensions at all and a Chromium-only
  # harness would leave half of NFR-017's promise unverified.
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Cache browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: browsers-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            browsers-${{ runner.os }}-

      - name: Install Chromium
        # `--with-deps` also installs the apt packages headless Chrome needs,
        # which are not cacheable and are the usual reason a browser job fails on
        # a fresh runner.
        run: pnpm exec playwright install --with-deps chromium

      - name: Build the Chromium package
        run: pnpm run build

      - name: Extension loads (Chromium)
        run: |
          export CHROME_PATH="$(node -e 'console.log(require("playwright").chromium.executablePath())')"
          pnpm run smoke:chrome

      - name: End-to-end fill (Chromium)
        # The whole pipeline against the reference page: every control kind, the
        # exclusions, confirmation fields, both frame kinds and an open shadow
        # root — all from one persona.
        run: |
          export CHROME_PATH="$(node -e 'console.log(require("playwright").chromium.executablePath())')"
          pnpm run e2e:chrome

      - name: Dependent fields (Chromium)
        # UC-034's scoreboard, and since 2026-08-15 a regression gate: all three
        # DD-009 steps have landed and every row is expected to pass. A red build
        # here means a cascade the engine used to follow and no longer does.
        #
        # It stays expectation-based rather than becoming a plain assertion, so
        # it still fails on a case that starts passing without its expectation
        # being updated in the same change. That direction matters as much as the
        # other: the table is the record of what this engine can do, and a row
        # that quietly starts passing is a claim nobody wrote down.
        run: |
          export CHROME_PATH="$(node -e 'console.log(require("playwright").chromium.executablePath())')"
          pnpm run cascade:chrome

      # Firefox on release candidates only, per NFR-014. Installed from Mozilla
      # directly rather than through Playwright, whose Firefox is a patched build
      # that does not expose the remote agent the BiDi harness attaches to.
      - name: Install Firefox
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          set -euo pipefail
          # `--fail` because without it curl exits 0 on a 404 and writes the
          # error page into the tarball: the job still fails, but as "not a
          # valid archive" from tar, naming the wrong step.
          curl -fsSL -o /tmp/firefox.tar.xz \
            'https://download.mozilla.org/?product=firefox-latest-ssl&os=linux64&lang=en-US'
          tar -xJf /tmp/firefox.tar.xz -C /tmp

      - name: Extension loads (Firefox)
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          pnpm run build:firefox
          FIREFOX_PATH=/tmp/firefox/firefox pnpm run smoke:firefox

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # No `version` input on purpose. The action refuses to run when a version
      # is given here *and* `packageManager` is set in package.json, and
      # package.json is the one that belongs: it pins 11.2.0 exactly, where
      # `version: 11` floats across minor releases. The package manager is an
      # input to the reproducible build (NFR-011), so it is pinned in the tree
      # rather than in the workflow, and local runs use the same version CI does.
      - uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Both targets from one source tree (NFR-017). Building only Chromium would
      # hide exactly the divergences C-003 and C-004 exist to cover.
      - name: Build Chrome and Firefox
        run: pnpm run build:all

      # NFR-003, ND-4, NFR-006 and NFR-008. The permission gate is the newest:
      # a permission list grows by accident far more easily than a dependency
      # list does, and it is the claim an auditor reads first.
      - name: Gate — page agent size, import graph, network absence, permissions
        run: pnpm run gate:all

      # Two clean builds, digests compared. Runs on every push rather than only
      # on tags: what breaks reproducibility is a dependency bump, and the useful
      # time to learn that is on the commit that bumped it.
      - name: Gate — reproducible build
        run: pnpm run verify:reproducible

      - name: Publish artefact digests
        run: pnpm run digest

      # Staged into a plain directory rather than uploaded straight from
      # `.output`. Two things about that path are hostile to the artifact
      # action's globbing: `.output` is a dot-directory, and a multi-line `path:`
      # arrives as one newline-joined string on this runner. Copying first
      # removes both questions, and `cp` fails loudly here — naming which file is
      # missing — instead of the upload reporting an empty match much later.
      - name: Stage release artefacts
        run: |
          set -euo pipefail
          mkdir -p artefacts
          cp .output/*.zip .output/SHA256SUMS artefacts/
          ls -l artefacts

      - name: Upload packages
        uses: actions/upload-artifact@v3
        with:
          name: fieldfiller-packages
          path: artefacts
          if-no-files-found: error
