<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!--
      Opened as an ordinary tab, not embedded. Both browsers default to the
      embedded surface — a fixed narrow panel inside chrome://extensions or
      about:addons — and this page is not a panel: it is twelve sections of
      settings, a rule editor whose two-column rows collapse below 30rem, and a
      per-control report table (DD-006). All of that reads as a phone-sized
      column in the embedded frame, at a width the user cannot change. WXT reads
      this meta tag into `options_ui.open_in_tab` (Safari excepted, which has no
      such key).
    -->
    <meta name="manifest.open_in_tab" content="true" />
    <!--
      No <title> text here: it is resolved from the i18n catalog by main.ts
      (NFR-018). Manifest and CSS accept __MSG_name__ substitution; HTML does
      not, so every string in this page arrives at runtime.

      Nothing is loaded from a remote origin — no font, no stylesheet, no script
      (NFR-006, G3). scripts/check-network.mjs fails the build on an external URL
      appearing in any shipped HTML or CSS.
    -->
    <title>FieldFiller</title>
    <link rel="stylesheet" href="./options.css" />
  </head>
  <body>
    <main>
      <h1 data-i18n="optionsTitle"></h1>
      <!--
        What the extension is, how to set it going, and the one thing this page's
        behaviour cannot be guessed from: there is no Save button, because every
        change is written as it is made (BR-009-1). A reader arriving from any
        other settings page looks for Save, does not find one, and has nothing on
        screen to learn from that their work was kept.
      -->
      <p class="lede" data-i18n="optionsIntro"></p>

      <!--
        Filled by main.ts when the background holds a report, and left empty
        otherwise (DD-006). The report itself is the last section on the page: a
        populated one measures over 2000px, so anywhere among the settings it
        cuts them in half, and it is empty most of the time because the
        background is torn down between uses. Being last made it undiscoverable,
        which is a different problem and this is its fix. The anchor is an
        ordinary deep link, which is one of the three things the single-scroll
        layout exists to keep working.
      -->
      <p id="report-lede" class="report-lede"></p>

      <!--
        Sections on one scrolling page rather than tabs: every setting stays
        findable with the browser's own find-in-page, deep links work, and there
        is no navigation state to keep accessible.

        Every heading is in the markup rather than built at runtime, so a screen
        reader has the page's outline before any script has run and before the
        background has answered anything. The empty <div> under each is what the
        section renders into.
      -->
      <section aria-labelledby="general-heading">
        <h2 id="general-heading" data-i18n="generalHeading"></h2>
        <div id="general"></div>
      </section>

      <!--
        UC-018. The bound on every rule's effective sources (FR-028), and above
        the rules for that reason: a source switched off here is off for every
        rule, including one that names it. Read after the rule editor, "whatever
        is enabled globally" named a set the reader had not been shown, and a
        rule could match nothing at all because of a checkbox further down.
      -->
      <section aria-labelledby="sources-heading">
        <h2 id="sources-heading" data-i18n="sourcesHeading"></h2>
        <p data-i18n="sourcesIntro"></p>
        <div id="sources"></div>
      </section>

      <!-- UC-009..UC-013. The list whose order is its precedence. -->
      <section aria-labelledby="rules-heading">
        <h2 id="rules-heading" data-i18n="rulesHeading"></h2>
        <p data-i18n="rulesIntro"></p>
        <div id="rules"></div>
      </section>

      <!--
        UC-014..UC-016. Still below the global rules on purpose: a profile is an
        exception to them, and the page reads top to bottom as general first,
        then scoped.
      -->
      <section aria-labelledby="profiles-heading">
        <h2 id="profiles-heading" data-i18n="profilesHeading"></h2>
        <p data-i18n="profilesIntro"></p>
        <div id="profiles"></div>
      </section>

      <!-- UC-020. Fields never to fill, plus the two structural skips. -->
      <section aria-labelledby="field-exclusions-heading">
        <h2 id="field-exclusions-heading" data-i18n="fieldExclusionsHeading"></h2>
        <p data-i18n="fieldExclusionsIntro"></p>
        <div id="field-exclusions"></div>
      </section>

      <!-- UC-021. Domains where the extension is loaded and never asked to act. -->
      <section aria-labelledby="domain-exclusions-heading">
        <h2 id="domain-exclusions-heading" data-i18n="domainExclusionsHeading"></h2>
        <p data-i18n="domainExclusionsIntro"></p>
        <div id="domain-exclusions"></div>
      </section>

      <!-- UC-022. What a fill does to a control it has decided to fill. -->
      <section aria-labelledby="behaviour-heading">
        <h2 id="behaviour-heading" data-i18n="behaviourHeading"></h2>
        <p data-i18n="behaviourIntro"></p>
        <div id="behaviour"></div>
      </section>

      <!-- UC-019. Policy, which the page's own constraints still override. -->
      <section aria-labelledby="passwords-heading">
        <h2 id="passwords-heading" data-i18n="passwordsHeading"></h2>
        <p data-i18n="passwordsIntro"></p>
        <div id="passwords"></div>
      </section>

      <!-- UC-023. Which ways of invoking a fill are available. -->
      <section aria-labelledby="triggers-heading">
        <h2 id="triggers-heading" data-i18n="triggersHeading"></h2>
        <p data-i18n="triggersIntro"></p>
        <div id="triggers"></div>
      </section>

      <!--
        UC-025. The configuration as a file that can be diffed, reviewed and kept
        in version control.
      -->
      <section aria-labelledby="export-heading">
        <h2 id="export-heading" data-i18n="exportHeading"></h2>
        <p data-i18n="exportIntro"></p>
        <div id="export"></div>
      </section>

      <!--
        UC-026. The other end of the same format: a file back in, with what it
        would replace shown before anything is replaced.
      -->
      <section aria-labelledby="import-heading">
        <h2 id="import-heading" data-i18n="importHeading"></h2>
        <p data-i18n="importIntro"></p>
        <div id="import"></div>
      </section>

      <!--
        UC-027. Its own control beside the import, not shared with it: the
        two make different promises — read back what this extension wrote,
        or translate what another product wrote — and a shared chooser
        would have to ask which was meant only after the file was open.
        Refused files are pointed between the two sections by recognition
        of what they contain. What the translation cannot carry is shown,
        in two lists, before anything is written.
      -->
      <section aria-labelledby="migrate-heading">
        <h2 id="migrate-heading" data-i18n="migrateHeading"></h2>
        <p data-i18n="migrateIntro"></p>
        <div id="migrate"></div>
      </section>

      <!--
        UC-028. The way back from any configuration: the shipped defaults,
        written over everything above in one replacement, behind a confirmation
        that says in counts what it will discard. Last of the portability trio —
        take a copy, put one back, or put nothing back.
      -->
      <section aria-labelledby="restore-heading">
        <h2 id="restore-heading" data-i18n="restoreHeading"></h2>
        <p data-i18n="restoreIntro"></p>
        <div id="restore"></div>
      </section>

      <!--
        UC-029. The last section, and the only one about the settings leaving
        this device at all. Off by default and decided per device (BR-029-1),
        with the two sentences that describe its ordinary operation — where it
        stops carrying, and what a conflict discards — standing above the
        toggle rather than behind it.
      -->
      <section aria-labelledby="sync-heading">
        <h2 id="sync-heading" data-i18n="syncHeading"></h2>
        <p data-i18n="syncIntro"></p>
        <div id="sync"></div>
      </section>

      <!--
        Politely announced changes that a sighted user sees in the list itself —
        a rule's new position after a move (BR-012-2). Empty until something
        needs saying, and never focused.
      -->
      <!--
        DD-006's third surface, and the answer to "did the rule I just wrote
        fire?". Last on the page, and not because it matters least.

        A populated report measures over 2000px against a 900px viewport, so
        placed among the settings it does not divide two sections, it buries
        them. It is also not a setting: every other section here configures
        something, and this one reports. And it is empty most of the time,
        because the background is torn down between uses.

        What being last actually cost was discoverability, and the line under the
        page title pays that instead, without moving two viewports of table into
        the middle of the settings.

        The section exists in the markup so the heading is present for a screen
        reader before the report arrives; main.ts fills #report once the
        background has answered, or explains why it cannot.
      -->
      <section aria-labelledby="report-heading">
        <h2 id="report-heading" data-i18n="reportHeading"></h2>
        <div id="report" aria-live="polite"></div>
      </section>

      <div id="announcements" class="visually-hidden" role="status" aria-live="polite"></div>

    </main>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
