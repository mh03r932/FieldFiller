<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!--
      No <title> text here: it is resolved from the i18n catalog by main.ts
      (NFR-018). Manifest and CSS accept __MSG_name__ substitution; HTML does
      not, so every string in this page arrives at runtime.

      Nothing is loaded from a remote origin — no font, no stylesheet, no script
      (NFR-006, G3). scripts/check-network.mjs fails the build on an external URL
      appearing in any shipped HTML or CSS.
    -->
    <title>FieldFiller</title>
    <link rel="stylesheet" href="./options.css" />
  </head>
  <body>
    <main>
      <h1 data-i18n="optionsTitle"></h1>

      <!--
        The rule editor. Sections on one scrolling page rather than tabs: every
        setting stays findable with the browser's own find-in-page, deep links
        work, and there is no navigation state to keep accessible.
      -->
      <section aria-labelledby="rules-heading">
        <h2 id="rules-heading" data-i18n="rulesHeading"></h2>
        <p data-i18n="rulesIntro"></p>
        <div id="rules"></div>
      </section>

      <!--
        Politely announced changes that a sighted user sees in the list itself —
        a rule's new position after a move (BR-012-2). Empty until something
        needs saying, and never focused.
      -->
      <div id="announcements" class="visually-hidden" role="status" aria-live="polite"></div>

      <!--
        DD-006's third surface. The section exists in the markup so the heading
        is present for a screen reader before the report arrives; main.ts fills
        #report once the background has answered, or explains why it cannot.
      -->
      <section aria-labelledby="report-heading">
        <h2 id="report-heading" data-i18n="reportHeading"></h2>
        <div id="report" aria-live="polite"></div>
      </section>
    </main>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
